<!doctype html>
<html>
  <head>
    <title>dohickey</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="main.css"/>
    <!-- <link rel="stylesheet" href="skew.css"/> -->
    <script type="text/javascript" src="js_client.js"></script>
    <script type="text/javascript">main_table()</script>
  </head>
  <body>
    <div id="content">
      <div class="content-main">
        <h1>
          <span id="title">title</span>
          <span id="user">{{username}}</span>
        </h1>
        <div style="position:relative">
          <table id="dohickey" style="">
            <tr id="dh-0">
              <th id="dh-0-0" class="placeholder">
                title
              </th>
            </tr>
          </table>
          <div id="history" class="open">
            <div id="history-content">
              <div class="flex-row">
                <div class="small">history</div>
                <button id="history-close" data-inert style="display:block">x</button>
              </div>
              <ul data-ord="desc"></ul>
            </div>
            <button id="history-open" data-inert>o</button>
          </div>
        </div>
        <div id="cli" data-inert>
          <ul id="cli-menu-bar" class="flex-row">
            <li style="border-color:var(--bg)">⬅️➡️⬆️⬇️</li>
            <li><span class="shortcut">e</span>dit</li>
            <li><span class="shortcut">v</span>ote</li>
          </ul>
          <ul id="cli-entry" class="flex-row">
            <li style="border-color:var(--bg)">%&nbsp;</li>
            <li id="cli-cli" class="placeholder open" data-inert contenteditable>
              lorem ipsum
            </li>
            <li id="cli-vote" class="closed" data-inert hidden>
              <ul id="cli-vote-opts" class="flex-row">
                <li data-val="1" class="vote rank-1">best</li>
                <li data-val="2" class="vote rank-2">good</li>
                <li data-val="3" class="vote rank-3">fine</li>
                <li data-val="4" class="vote rank-4">bad</li>
                <li data-val="5" class="vote rank-5">worst</li>
              </ul>
            </li>
            <li><button id="cli-save" data-inert>save</button></li>
          </ul>
        </div>
      </div>
    </div>
    <div hidden>
      <table>
        <tr id="row-template"></tr>
        <tr>
          <th id="header-template">
            <div class="cell">
              <div class="text"></div>
            </div>
          </th>
          <td id="cell-template">
            <div class="cell">
              <div class="vote"></div>
              <div class="text"></div>
            </div>
            <form class="ballot-box" hidden="true">
            </form>
          </td>
        </tr>
      </table>
      <li id="hist-item-template" class="template">
        <div>
          <span data-key="type"></span>
          <span data-key="text"></span>
        </div>
        <div class="small">
          <span data-key="author"></span> at <span data-key="time"></span>
        </div>
      </li>
  </body>
</html>
